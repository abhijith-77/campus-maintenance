<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign in — CampusFix</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="auth-page">

    <!-- Ambient Background -->
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>


    <main class="auth-container">

        <!-- Brand Panel -->
        <section class="auth-brand-panel">

            <a href="index.html" class="auth-brand">

                <div class="brand-mark">
                    <span></span>
                </div>

                <div class="brand-text">
                    <strong>CampusFix</strong>
                    <small>Smart Campus Maintenance</small>
                </div>

            </a>


            <div class="auth-brand-content">

                <div class="eyebrow auth-eyebrow">
                    <span class="eyebrow-dot"></span>
                    Campus maintenance
                </div>

                <h1>
                    Welcome back to
                    <span>CampusFix.</span>
                </h1>

                <p>
                    Sign in to report issues, track maintenance
                    requests and stay connected with your campus.
                </p>

            </div>


            <div class="auth-orbit">

                <div class="auth-orbit-ring ring-one"></div>
                <div class="auth-orbit-ring ring-two"></div>

                <div class="auth-orbit-core">
                    CF
                </div>

            </div>

        </section>


        <!-- Login Card -->
        <section class="auth-card">

            <div class="auth-card-header">

                <div class="auth-task-icon">
                    ✓
                </div>

                <div>
                    <h2>Welcome back</h2>

                    <p>
                        Sign in with your email and password
                        to continue.
                    </p>
                </div>

            </div>


            <!-- Login Form -->
            <form id="loginForm" class="auth-form">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <small
                        id="emailError"
                        class="field-error"
                    ></small>

                </div>


                <div class="form-group">

                    <div class="password-label-row">

                        <label for="password">
                            Password
                        </label>

                        <a href="#" class="forgot-link">
                            Forgot password?
                        </a>

                    </div>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                    <small
                        id="passwordError"
                        class="field-error"
                    ></small>

                </div>


                <!-- Error Message -->

                <div
                    id="loginError"
                    class="auth-message error-message hidden"
                ></div>


                <!-- Login Button -->

                <button
                    type="submit"
                    id="loginButton"
                    class="btn btn-primary auth-submit"
                >
                    <span id="loginButtonText">
                        Sign in
                    </span>

                    <span id="loginSpinner" class="spinner hidden"></span>
                </button>

            </form>


            <!-- Footer -->

            <div class="auth-footer">

                <span>
                    New to CampusFix?
                </span>

                <a href="register.html">
                    Create an account
                </a>

            </div>

        </section>

    </main>


    <script src="./js/common.js"></script>
    <script src="./js/fx.js"></script>
    <script src="./js/login.js"></script>

</body>

</html>
